<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16283d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deni">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Deni – who owes you</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#e6eee4;--line:#c4d3c1;--ink:#16283d;--mute:#5d7066;--card:#f6faf4;--owe:#b8322a;--ok:#1d7a5a;--btn:#16283d;--btnt:#f6faf4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101b17;--line:#22352d;--ink:#e3eee7;--mute:#8fa59a;--card:#16251f;--owe:#f0867d;--ok:#5fcf9f;--btn:#e3eee7;--btnt:#101b17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101b17;--line:#22352d;--ink:#e3eee7;--mute:#8fa59a;--card:#16251f;--owe:#f0867d;--ok:#5fcf9f;--btn:#e3eee7;--btnt:#101b17;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,sans-serif;
background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--line) 31px,var(--line) 32px)}
main{max-width:620px;margin:0 auto;padding:20px 16px 60px 40px;position:relative;min-height:100vh}
main::before{content:"";position:absolute;left:28px;top:0;bottom:0;width:2px;background:var(--owe);opacity:.55}
h1{font:800 15px/1 "Bricolage Grotesque",Figtree,sans-serif;margin:0 0 18px;letter-spacing:.01em}
.total{font:800 clamp(40px,12vw,64px)/1 "Bricolage Grotesque",Figtree,sans-serif;color:var(--owe);margin:0}
.sub{color:var(--mute);margin:4px 0 22px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0;flex:1 1 140px}
input:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
button,.btn{font:600 15px Figtree,sans-serif;background:var(--btn);color:var(--btnt);border:0;border-radius:6px;padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-block}
button.ghost,.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.pay{background:var(--ok);color:#fff}
details{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:8px}
summary{list-style:none;display:flex;justify-content:space-between;gap:12px;padding:12px 14px;cursor:pointer;align-items:baseline}
summary::-webkit-details-marker{display:none}
.nm{font-weight:600}.ph{color:var(--mute);font-size:14px}
.bal{font:800 18px "Bricolage Grotesque",Figtree,sans-serif;color:var(--owe);white-space:nowrap}
.bal.zero{color:var(--ok)}
.body{padding:0 14px 14px}
.tx{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-bottom:1px dashed var(--line)}
.tx span:last-child{white-space:nowrap}.cr{color:var(--owe)}.pd{color:var(--ok)}
.empty{color:var(--mute);padding:18px 0}
.foot{margin-top:28px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--mute);font-size:14px}
.foot input{flex:0 1 90px;padding:6px 8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top h1{margin:0}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
select:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){details[open]>.body{animation:o .15s ease-out}@keyframes o{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>
<main>
<div class="top"><h1>Deni</h1><select id="lang" aria-label="Language"><option value="en">English</option><option value="sw">Kiswahili</option></select></div>
<p class="total" id="total">0</p>
<p class="sub" id="sub">Total owed to you</p>

<div class="row">
<input id="nm" data-p="name" autocomplete="off">
<input id="ph" data-p="phone" inputmode="tel" autocomplete="off">
<button id="add" data-t="add">Add customer</button>
</div>
<div class="row"><input id="q" data-p="search" autocomplete="off"></div>

<div id="list"></div>

<div class="foot">
<span data-t="cur">Currency</span><input id="cur" maxlength="5">
<span data-t="dial">Dial code</span><input id="dial" maxlength="4" inputmode="numeric">
<button class="ghost" id="copy" data-t="copy">Copy summary</button>
</div>
<p class="ph" style="margin-top:14px" data-t="note">Saved on this device only. Clearing browser data erases it.</p>
</main>
<script>
var KEY="deni-v1",S={cur:"KSh",dial:"254",lang:((navigator.language||"en").slice(0,2)==="sw"?"sw":"en"),c:[]};
var L={en:{add:'Add customer',name:'Customer name',phone:'Phone (optional)',search:'Search customers',cur:'Currency',dial:'Dial code',copy:'Copy summary',copied:'Copied',copyfail:'Copy failed',note:'Saved on this device only. Clearing browser data erases it.',owed1:'Owed by 1 customer',owedN:'Owed by {n} customers',none:'Nobody owes you right now',empty1:'Add your first customer above, then record what they take on credit.',empty2:'No customer matches that search.',nophone:'No phone',credit:'Credit',settled:'Settled',amt:'Amount',notePh:'Note (e.g. sugar, bread)',addCr:'Add credit',pay:'Record payment',remind:'Remind on WhatsApp',del:'Delete',noEntries:'No entries yet.',delConfirm:'Delete {n} and all their entries?',msg:'Hello {n}, a friendly reminder that you have an outstanding balance of {b}. Thank you!',nobodyOwes:'Nobody owes anything.'},
sw:{add:'Ongeza mteja',name:'Jina la mteja',phone:'Simu (si lazima)',search:'Tafuta wateja',cur:'Sarafu',dial:'Msimbo wa nchi',copy:'Nakili muhtasari',copied:'Imenakiliwa',copyfail:'Imeshindwa kunakili',note:'Data inahifadhiwa kwenye kifaa hiki pekee. Ukifuta data ya kivinjari, itapotea.',owed1:'Mteja 1 anakudai',owedN:'Wateja {n} wanakudai',none:'Hakuna anayekudai sasa hivi',empty1:'Ongeza mteja wako wa kwanza hapo juu, kisha andika deni analochukua.',empty2:'Hakuna mteja anayelingana na utafutaji huo.',nophone:'Hakuna simu',credit:'Amelipa ziada',settled:'Amelipa yote',amt:'Kiasi',notePh:'Maelezo (mf. sukari, mkate)',addCr:'Ongeza deni',pay:'Weka malipo',remind:'Kumbusha kwa WhatsApp',del:'Futa',noEntries:'Hakuna rekodi bado.',delConfirm:'Futa {n} na rekodi zake zote?',msg:'Habari {n}, ni ukumbusho tu kwamba una deni la {b}. Asante!',nobodyOwes:'Hakuna anayedaiwa.'}};
function tr(k,v){var s=(L[S.lang]||L.en)[k]||L.en[k]||k;if(v)for(var i in v)s=s.replace("{"+i+"}",function(){return v[i]});return s}
function dt(x){return x.ts?new Date(x.ts).toLocaleDateString(S.lang==="sw"?"sw-KE":"en-GB",{day:"numeric",month:"short"}):x.d}
try{var raw=localStorage.getItem(KEY);if(raw){S=Object.assign(S,JSON.parse(raw))}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(id){return document.getElementById(id)}
function bal(c){return c.t.reduce(function(a,x){return a+x.a},0)}
function fmt(n){return S.cur+" "+Math.abs(n).toLocaleString()}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}
function wa(c){var d=c.p.replace(/\D/g,"");if(!d)return"";if(d.charAt(0)==="0")d=S.dial+d.slice(1);
var m=tr("msg",{n:c.n,b:fmt(bal(c))});
return"https://wa.me/"+d+"?text="+encodeURIComponent(m)}
var openId=null;
function render(){
var q=$("q").value.toLowerCase(),tot=0,n=0;
S.c.forEach(function(c){var b=bal(c);if(b>0){tot+=b;n++}});
$("total").textContent=fmt(tot);
$("sub").textContent=n?tr(n===1?"owed1":"owedN",{n:n}):tr("none");
var l=S.c.filter(function(c){return c.n.toLowerCase().indexOf(q)>-1}).sort(function(a,b){return bal(b)-bal(a)});
if(!l.length){$("list").innerHTML='<p class="empty">'+(S.c.length?tr("empty2"):tr("empty1"))+"</p>";return}
$("list").innerHTML=l.map(function(c){var b=bal(c),link=wa(c);
var tx=c.t.slice().reverse().slice(0,12).map(function(x){return'<div class="tx"><span>'+esc(dt(x))+(x.m?" – "+esc(x.m):"")+'</span><span class="'+(x.a>0?"cr":"pd")+'">'+(x.a>0?"+":"−")+Math.abs(x.a).toLocaleString()+"</span></div>"}).join("")||'<p class="ph">'+tr("noEntries")+'</p>';
return'<details data-id="'+c.id+'"'+(c.id===openId?" open":"")+'><summary><span><span class="nm">'+esc(c.n)+'</span><br><span class="ph">'+esc(c.p||tr("nophone"))+'</span></span><span class="bal'+(b<=0?" zero":"")+'">'+(b>0?fmt(b):b<0?tr("credit")+" "+fmt(b):tr("settled"))+'</span></summary><div class="body">'+
'<div class="row"><input class="amt" type="number" min="0" step="any" placeholder="'+tr("amt")+'" inputmode="decimal"><input class="note" placeholder="'+tr("notePh")+'"></div>'+
'<div class="row"><button data-act="cr">'+tr("addCr")+'</button><button class="pay" data-act="pd">'+tr("pay")+'</button>'+(link&&b>0?'<a class="btn ghost" target="_blank" rel="noopener" href="'+link+'">'+tr("remind")+'</a>':"")+'<button class="ghost" data-act="del">'+tr("del")+'</button></div>'+tx+"</div></details>"}).join("")}
$("add").onclick=function(){var n=$("nm").value.trim();if(!n){$("nm").focus();return}
var c={id:Date.now().toString(36),n:n,p:$("ph").value.trim(),t:[]};S.c.push(c);openId=c.id;$("nm").value="";$("ph").value="";save();render()};
$("q").oninput=render;
$("list").addEventListener("toggle",function(e){if(e.target.open)openId=e.target.dataset.id},true);
$("list").addEventListener("click",function(e){var b=e.target.closest("button[data-act]");if(!b)return;
var d=b.closest("details"),id=d.dataset.id,c=S.c.filter(function(x){return x.id===id})[0],act=b.dataset.act;
if(act==="del"){if(confirm(tr("delConfirm",{n:c.n}))){S.c=S.c.filter(function(x){return x.id!==id});save();render()}return}
var v=parseFloat(d.querySelector(".amt").value);if(!(v>0)){d.querySelector(".amt").focus();return}
c.t.push({ts:Date.now(),a:act==="cr"?v:-v,m:d.querySelector(".note").value.trim()});openId=id;save();render()});
$("cur").value=S.cur;$("dial").value=S.dial;
$("cur").onchange=function(){S.cur=this.value.trim()||"KSh";save();render()};
$("dial").onchange=function(){S.dial=this.value.replace(/\D/g,"")||"254";save()};
function applyLang(){document.documentElement.lang=S.lang;$("lang").value=S.lang;
document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=tr(e.dataset.t)});
document.querySelectorAll("[data-p]").forEach(function(e){e.placeholder=tr(e.dataset.p)});render()}
$("lang").onchange=function(){S.lang=this.value;save();applyLang()};
$("copy").onclick=function(){var t=S.c.filter(function(c){return bal(c)>0}).sort(function(a,b){return bal(b)-bal(a)}).map(function(c){return c.n+": "+fmt(bal(c))}).join("\n")||tr("nobodyOwes");
var b=this;try{navigator.clipboard.writeText(t).then(function(){b.textContent=tr("copied")},function(){b.textContent=tr("copyfail")})}catch(e){b.textContent=tr("copyfail")}setTimeout(function(){b.textContent=tr("copy")},1500)};
applyLang();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
